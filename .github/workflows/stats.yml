name: update downloads

# 把 Release 的下载计数写回 plugins/index.json（市场里"下载量"排序与"下载 N 次"靠它）。
# 每天早上跑一次；手动 dispatch 也行。写不进去不会让 CI 红：统计失败只是这一项数据旧一天。
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
      - run: node scripts/update-downloads.mjs
        env:
          # 优先用带 bypass 的 STATS_TOKEN；没有 secret 时退回 GITHUB_TOKEN（会被分支保护挡下）
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      # 有变化就提交（[skip ci] 避免再触发一轮 verify：计数变化不影响内容校验）
      - name: commit if changed
        run: |
          if [ -n "$(git status --porcelain plugins/index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plugins/index.json
            git commit -m "chore: 更新下载量 [skip ci]"
            # main 已开分支保护（必须走 PR + verify），GITHUB_TOKEN 不能直接推。
            # 统计只是展示数据，不能因此每天发失败邮件：推不上去就保留旧值并明确提示。
            if ! git push; then
              echo "::warning::下载量已统计但无法写回 main（分支保护禁止直接推送）；本次保留旧值"
              echo "要恢复自动更新：改用 PAT 走 PR 流程，或为该 workflow 配置受控的绕过规则。"
              exit 0
            fi
          else
            echo "没有变化"
          fi
