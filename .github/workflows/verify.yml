name: verify index

on:
  pull_request:
  # 发布脚本 --push 是直接推 main（不走 PR），这里必须也响应 push ——
  # 否则"当天就暴露"这句承诺要靠 03:20 那班定时任务兑现，最多晚一天
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每天 03:20（UTC）自动核对一次：谁的 Release 被删了、文件被换了、镜像挂了，当天就能看见
    - cron: "20 3 * * *"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
      # PR / push 只做离线核对（结构 + 仓库内产物 + sha256）。
      # 新包要先合进 main、由 sync-packages 传上 Release，远端才拿得到；
      # 传完之后那班 workflow 会跑一次真下载核对。定时任务兜底。 
      - name: 校验索引
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            node scripts/verify-index.mjs --no-remote
          else
            node scripts/verify-index.mjs
          fi
